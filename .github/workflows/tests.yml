name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: setup python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: install deps
      run: |
        pip install -r requirements.txt

    - name: run tests
      run: |
        pytest